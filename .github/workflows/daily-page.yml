name: Daily page

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Only the venv and Playwright's browsers; the per-station Windguru cache under
      # ~/.cache/surf-forecast-uruguay/windguru must never be restored into a run.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/surf-forecast-uruguay/venv
            ~/.cache/ms-playwright
          key: surf-venv-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('skills/surf-forecast-uruguay/requirements.txt') }}

      - name: Test
        run: python -m unittest discover -s tests

      - name: Build report
        run: |
          mkdir -p _site
          bash skills/surf-forecast-uruguay/scripts/run_surf_html.sh --no-cache --out _site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
